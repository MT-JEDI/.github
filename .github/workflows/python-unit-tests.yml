name: Python Unit Tests
# Coverage ratchet: combines per-suite coverage into a repo-wide total and
# compares it against coverage-baseline.txt at the repo root (absent file =
# advisory notice only). If a repo uses the test-script input, the script may
# opt into the ratchet by leaving coverage data files at coverage-data/.coverage.*
# Note: suites with no collectable tests still count their source at 0% in the
# repo-wide total (deliberate: untested code drags the ratchet).

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to run tests under'
        default: '3.13'
        required: false
        type: string
      test-root:
        description: 'Directory under which to discover tests'
        default: '.'
        required: false
        type: string
      test-script:
        description: 'Optional repo-local script that replaces test discovery entirely'
        default: ''
        required: false
        type: string

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Discover test directories
        id: discover
        run: |
          # .terraform is excluded for parity with the repo-local mirror scripts
          # (scripts/run-unit-tests.sh), not for this job's benefit: a CI checkout has no
          # .terraform, since it is gitignored and nothing here runs terraform init, so
          # the exclusion is a no-op upstream. It matters locally, where a terraform-inited
          # repo would otherwise run the vendored suites under .terraform/modules/* and
          # count their uncovered source in the coverage total. Keeping both discovery
          # lists textually identical is what stops the exclusion being dropped by
          # syncing one file to the other.
          #
          # The excluded trees are pruned rather than filtered out of the results. Both
          # forms select the same directories, but -not -path still descends into every
          # excluded tree while scanning: in the largest repo that cost 8.7s of discovery
          # per local run against 0.06s pruned. Negligible here (a fresh checkout has no
          # .venv or .terraform to descend into) and kept identical to the local mirror.
          # -prune suppresses find's implicit print, hence the explicit -print.
          candidates=$(find "${{ inputs.test-root }}" \( -path '*/node_modules/*' \
            -o -path '*/.venv/*' -o -path '*/test-env/*' -o -path '*/.git/*' \
            -o -path '*/automation-tests/*' -o -path '*/.terraform/*' \) -prune \
            -o -type d -name tests -print)
          dirs=""
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            if [ -n "$(find "$d" -name '*.py' -print -quit)" ]; then
              dirs="${dirs}${d}"$'\n'
            fi
          done <<< "$candidates"
          {
            echo "dirs<<DIRS_EOF"
            echo "$dirs"
            echo "DIRS_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$dirs" ] && [ -z "${{ inputs.test-script }}" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: No tests found (vacuous pass)
        if: steps.discover.outputs.found == 'false'
        run: echo "::notice::No unit tests found in this repository. The unit-test gate passes vacuously. Add tests under a tests/ directory to activate it."

      - name: Install dependencies
        if: steps.discover.outputs.found == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-mock pytest-asyncio coverage
          find "${{ inputs.test-root }}" -name requirements.txt \
            -not -path '*/node_modules/*' -not -path '*/automation-tests/*' \
            -not -path '*/.venv/*' -not -path '*/test-env/*' -not -path '*/.git/*' \
            -exec pip install -r {} \;
          find "${{ inputs.test-root }}" -name requirements-dev.txt \
            -not -path '*/node_modules/*' -not -path '*/automation-tests/*' \
            -not -path '*/.venv/*' -not -path '*/test-env/*' -not -path '*/.git/*' \
            -exec pip install -r {} \;

      - name: Run unit tests
        if: steps.discover.outputs.found == 'true'
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
        run: |
          mkdir -p test-results coverage-data
          if [ -n "${{ inputs.test-script }}" ]; then
            bash "${{ inputs.test-script }}"
            exit $?
          fi
          layer_paths=""
          while IFS= read -r -d '' p; do
            layer_paths="${GITHUB_WORKSPACE}/${p#./}:${layer_paths}"
          # Pruned like the discovery find above, and over the same set: besides the
          # traversal cost, it keeps a vendored layers/*/python (under .terraform in a
          # local checkout) from reaching PYTHONPATH.
          done < <(find . \( -path '*/node_modules/*' -o -path '*/.venv/*' \
            -o -path '*/test-env/*' -o -path '*/.git/*' -o -path '*/automation-tests/*' \
            -o -path '*/.terraform/*' \) -prune \
            -o -type d -path '*/layers/*/python' -print0)
          failed=0
          while IFS= read -r test_dir; do
            [ -z "$test_dir" ] && continue
            src_dir=$(dirname "$test_dir")
            name=$(echo "$src_dir" | tr '/.' '--')
            echo "::group::Running tests in $src_dir"
            rc=0
            (cd "$src_dir" && PYTHONPATH=".:${layer_paths}${PYTHONPATH:-}" \
              COVERAGE_FILE="$GITHUB_WORKSPACE/coverage-data/.coverage.$name" \
              python -m coverage run --source=. -m pytest tests/ \
              --junitxml="$GITHUB_WORKSPACE/test-results/$name-results.xml" --tb=short -v) || rc=$?
            if [ "$rc" -eq 5 ]; then
              echo "::warning::No tests collected in $src_dir (pytest exit 5); treating as skipped."
            elif [ "$rc" -ne 0 ]; then
              failed=1
            fi
            echo "::endgroup::"
          done <<< "${{ steps.discover.outputs.dirs }}"
          exit $failed

      - name: Coverage ratchet
        if: steps.discover.outputs.found == 'true'
        run: |
          if ! ls coverage-data/.coverage.* >/dev/null 2>&1; then
            echo "::notice::No coverage data produced; coverage ratchet skipped."
            exit 0
          fi
          if ! coverage combine coverage-data/ 2>/dev/null; then
            echo "::notice::No combinable coverage data; coverage ratchet skipped."
            exit 0
          fi
          if ! coverage json -o coverage-total.json \
            --omit='*/tests/*,*/test-env/*,*/.venv/*,*/node_modules/*' 2>/dev/null; then
            echo "::notice::No measurable coverage; coverage ratchet skipped."
            exit 0
          fi
          total=$(python -c "import json; print(round(json.load(open('coverage-total.json'))['totals']['percent_covered'], 1))")
          echo "Repo-wide unit-test coverage: ${total}%"
          if [ ! -f coverage-baseline.txt ]; then
            echo "::notice::No coverage baseline; repo-wide coverage is ${total}%. Commit coverage-baseline.txt (a single number) at the repo root to enable the ratchet."
            exit 0
          fi
          baseline=$(head -n1 coverage-baseline.txt | tr -d '[:space:]')
          if ! [[ "$baseline" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "::error::coverage-baseline.txt must contain a single number (found: '${baseline}'). Fix or remove the file."
            exit 1
          fi
          python -c "
          import sys
          total, baseline = float('${total}'), float('${baseline}')
          if total < baseline:
              print(f'::error::Coverage {total}% is below the baseline {baseline}% (coverage-baseline.txt). Add tests, or lower the baseline in this PR with justification.')
              sys.exit(1)
          if total >= baseline + 1.0:
              print(f'::notice::Coverage rose to {total}% (baseline {baseline}%). Bump coverage-baseline.txt.')
          "

      - name: Publish test results
        if: always() && steps.discover.outputs.found == 'true'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: 'test-results/*.xml'
          check_name: 'Python Unit Test Results'
          comment_mode: always
          fail_on: test failures
