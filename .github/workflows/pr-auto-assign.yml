name: PR auto assign author

on:
  workflow_call:

jobs:
  assign-author:
    permissions:
      pull-requests: write
      contents: read
      issues: write
    runs-on: ubuntu-latest
    name: Assign PR to creator
    steps:
      - name: Assign PR to creator
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('Caller must run on pull_request so pull_request payload is available.');
              return;
            }
            const author = pr.user.login;

            const isAlreadyAssigned = pr.assignees.some(user => user.login === author);

            if (!isAlreadyAssigned) {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [author]
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `👋 Auto Assigned to @${author}`
              });

              console.log(`Successfully auto assigned ${author} to PR #${pr.number}`);
            } else {
              console.log(`${author} is already assigned. No auto action taken.`);
            }
