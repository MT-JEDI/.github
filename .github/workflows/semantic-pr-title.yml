name: Semantic PR Title

on:
  workflow_call:

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title against conventional commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            test
            refactor
            ci
            perf
            build
            revert
          requireScope: false
