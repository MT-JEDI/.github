name: Semantic PR Title

on:
  workflow_call:

jobs:
  pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title against conventional commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            test
            refactor
            ci
            perf
            build
            revert
          # Scope is one ADO ticket or NO-TICKET, e.g. feat(ADO-123): Add X
          requireScope: true
          scopes: |
            ADO-\d+
            NO-TICKET
          # No comma in the scope, so a title carries one ticket only
          headerPattern: '^(\w*)(?:\(([\w-]*)\))?: (.*)$'
          headerPatternCorrespondence: type, scope, subject
