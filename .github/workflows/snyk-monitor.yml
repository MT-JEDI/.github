name: Snyk Monitor

on:
  workflow_call:
    inputs:
      project-tag:
        description: 'Snyk project tag for this repository (e.g. iot-firmware)'
        required: true
        type: string
      team-tag:
        description: 'Snyk team tag'
        default: 'JEDI'
        required: false
        type: string
      lifecycle:
        description: 'Snyk project lifecycle'
        default: 'production'
        required: false
        type: string
      severity-iac:
        description: 'Severity threshold for the IaC report'
        default: 'high'
        required: false
        type: string
      python-version:
        description: 'Python version for dependency install'
        default: '3.13'
        required: false
        type: string
      aws-role:
        description: >-
          Optional IAM role to assume for a CodeArtifact login before installing
          dependencies, for repos whose requirements come from a private index. Leave
          empty to skip it entirely (the default). Same contract as the input of the
          same name on python-unit-tests.yml.
        default: ''
        required: false
        type: string
      codeartifact-region:
        description: 'Region for the CodeArtifact login (defaults to the domain region)'
        default: 'us-east-1'
        required: false
        type: string
      codeartifact-domain:
        description: 'CodeArtifact domain to log pip into (requires aws-role)'
        default: ''
        required: false
        type: string
      codeartifact-domain-owner:
        description: 'Account id owning the CodeArtifact domain (requires aws-role)'
        default: ''
        required: false
        type: string
      codeartifact-repository:
        description: 'CodeArtifact repository to log pip into (requires aws-role)'
        default: ''
        required: false
        type: string
    secrets:
      SNYK_TOKEN:
        required: true
      SNYK_AWS_ROLE_ARN:
        required: true

jobs:
  snyk-monitor:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      # Only for repos whose requirements resolve against a private CodeArtifact index.
      # Without it, `pip install -r` cannot fetch those wheels, and `snyk monitor` then
      # fails to build a dependency tree, so the repo silently stops being monitored.
      #
      # This runs BEFORE the Snyk role is assumed, on purpose. `aws codeartifact login`
      # writes an index URL with an embedded token into pip's config file, and that file
      # outlives the credential swap that follows, so pip can still resolve during the
      # install step. Assuming the Snyk role afterwards also means these credentials do
      # not linger in the job environment, so no separate revoke step is needed.
      - name: Configure AWS credentials for CodeArtifact
        if: inputs.aws-role != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role }}
          aws-region: ${{ inputs.codeartifact-region }}

      - name: Log pip into CodeArtifact
        if: inputs.aws-role != ''
        env:
          DOMAIN: ${{ inputs.codeartifact-domain }}
          DOMAIN_OWNER: ${{ inputs.codeartifact-domain-owner }}
          REPOSITORY: ${{ inputs.codeartifact-repository }}
        run: |
          for name in DOMAIN DOMAIN_OWNER REPOSITORY; do
            if [ -z "${!name}" ]; then
              input_name=$(echo "$name" | tr 'A-Z_' 'a-z-')
              echo "::error::aws-role was supplied without codeartifact-${input_name}; pass all four inputs or none."
              exit 1
            fi
          done
          aws codeartifact login --tool pip \
            --domain "$DOMAIN" \
            --domain-owner "$DOMAIN_OWNER" \
            --repository "$REPOSITORY"

      # Moved below checkout/setup-python so the optional CodeArtifact login above can
      # run first. Nothing before this point uses AWS, so the move is inert, and this
      # remains the credential in effect for the install and monitor steps.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SNYK_AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 aws-xray-sdk pydantic aws-lambda-powertools
          find . -name "requirements.txt" \
            -not -path '*/node_modules/*' -not -path '*/.venv/*' \
            -not -path '*/test-env/*' -not -path '*/.git/*' \
            -exec pip install -r {} \;
          find . -name package.json \
            -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/.terraform/*' \
            | while IFS= read -r pkg; do
              dir=$(dirname "$pkg")
              echo "Installing Node dependencies in $dir"
              (cd "$dir" && if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi) \
                || echo "::warning::npm install failed in $dir; snyk will surface it"
            done

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk Monitor
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk monitor \
            --tags=scmhost=github,scmorg=${{ github.repository_owner }},scmrepo=${{ github.event.repository.name }},team=${{ inputs.team-tag }},project=${{ inputs.project-tag }} \
            --target-reference=${{ github.ref_name }} \
            --all-projects \
            --project-lifecycle=${{ inputs.lifecycle }}
          rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::notice::Snyk Monitor found no supported manifests in this repository; passing."
            exit 0
          fi
          exit $rc

  snyk-iac-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk IaC Test and Report
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk iac test --severity-threshold=${{ inputs.severity-iac }} --report \
            --tags=scmhost=github,scmorg=${{ github.repository_owner }},scmrepo=${{ github.event.repository.name }},team=${{ inputs.team-tag }},project=${{ inputs.project-tag }} \
            --target-reference=${{ github.ref_name }} \
            --project-lifecycle=${{ inputs.lifecycle }}
          rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::notice::Snyk IaC found no supported files in this repository; passing."
            exit 0
          fi
          exit $rc
