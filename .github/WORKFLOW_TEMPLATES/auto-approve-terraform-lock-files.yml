name: Auto Approve Terraform Lock Files

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Check if only terraform lock files are changed
        id: check_files
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -qv '\.terraform.lock.hcl$'; then
            echo "::set-output name=approve::false"
          else
            echo "::set-output name=approve::true"
          fi

      - name: Approve pull request
        if: steps.check_files.outputs.approve == 'true'
        uses: hmarr/auto-approve-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge pull request
        if: steps.check_files.outputs.approve == 'true'
        uses: pascalgn/automerge-action@v0.10.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          delete-branch: true
          merge-method: squash